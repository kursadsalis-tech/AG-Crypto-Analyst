name: Paper integration tests

on:
  push:
    branches:
      - fix/decision026-sqlite-startup-lock
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Compile integration modules
        run: python -m compileall -q paper_trading runtime database tests
      - name: Run paper integration tests
        run: |
          python -m unittest -v \
            tests.test_experience_memory \
            tests.test_position_management \
            tests.test_executable_quotes \
            tests.test_execution_contract \
            tests.test_execution_market_data \
            tests.test_execution_model \
            tests.test_crypto_profit_agent_fail_closed \
            tests.test_paper_selection_cycle \
            tests.test_paper_governance
      - name: Check main merge compatibility without modifying branch
        run: |
          git fetch --no-tags origin main
          git merge-tree --write-tree origin/main HEAD
      - name: Run broad offline regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
