name: AGCA PAPER integration

on:
  push:
    branches:
      - agent/vm-checkpoint-20260919
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Compile integration modules
        run: python -m compileall -q paper_trading runtime database tests
      - name: Run paper integration tests
        run: |
          python -m unittest -v \
            tests.test_experience_memory \
            tests.test_position_management \
            tests.test_executable_quotes \
            tests.test_execution_contract \
            tests.test_execution_market_data \
            tests.test_execution_model \
            tests.test_crypto_profit_agent_fail_closed \
            tests.test_single_runtime_authority \
            tests.test_paper_governance \
            tests.test_control_center_live_state \
            tests.test_control_center_read_model \
            tests.test_control_center_presentation \
            tests.test_control_center_server
      - name: Check canonical branch ancestry
        run: |
          # main is the canonical product branch; lifecycle authority is enforced by
          # tests.test_single_runtime_authority.
          git fetch --no-tags origin main
          git merge-base HEAD origin/main
      - name: Install research test dependencies
        if: success() || failure()
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run broad offline regression suite
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_*.py' -v
